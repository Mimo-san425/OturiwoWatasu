const groupHtml={"手工芸":"<ruby>手工芸<rt>しゅこうげい</rt></ruby><ruby>班<rt>はん</rt></ruby>","園芸":"<ruby>園芸<rt>えんげい</rt></ruby><ruby>班<rt>はん</rt></ruby>","陶工":"<ruby>陶工<rt>とうこう</rt></ruby><ruby>班<rt>はん</rt></ruby>","リサイクル":"リサイクル<ruby>班<rt>はん</rt></ruby>","工芸":"<ruby>工芸<rt>こうげい</rt></ruby><ruby>班<rt>はん</rt></ruby>"};

const values=[1000,500,100,50,10],patterns={50:[50,100,500],100:[100,500,1000],200:[200,500,1000],300:[300,500,1000],400:[400,500,1000],600:[600,1000],1000:[1000,2000]};

const msg={selected:"<ruby>渡<rt>わた</rt></ruby>す<ruby>金額<rt>きんがく</rt></ruby>を<ruby>確認<rt>かくにん</rt></ruby>してください",reselect:"おつりを<ruby>選<rt>えら</rt></ruby>びなおしてください",has:"おつりがあります",none:"おつりはありません",little:"おつりがたりません",much:"おつりがおおすぎます"};

const $=id=>document.getElementById(id);

let group="",prev="",q=1,correct=0,pay=0,change=0,payMoney=[],selected=[],locked=false;

groups.forEach(g=>{const b=document.createElement("button");b.className="group-button "+g[1];b.innerHTML=`<span class="group-icon">${g[2]}</span>${g[3]}`;b.onclick=()=>{group=g[0];prev="";q=1;correct=0;$("groupBadge").innerHTML=groupHtml[group];randomProduct()};$("groupGrid").appendChild(b)});

values.forEach(v=>{const b=document.createElement("button");b.className="money-button";b.innerHTML=`<img src="images/money_${v}.png" alt="${v}円"><div class="money-button-label">${v}<ruby>円<rt>えん</rt></ruby></div><span class="money-count" id="count${v}">0</span>`;b.querySelector("img").onerror=e=>e.target.style.display="none";b.onclick=()=>{if(locked)return;selected.push(v);updateSelected();$("message").innerHTML=msg.selected};$("moneyButtons").appendChild(b)});

function show(name){$("groupScreen").classList.toggle("hidden",name!=="group");$("registerScreen").classList.toggle("hidden",name!=="register");scrollTo(0,0)}

function randomProduct(){let a=products.filter(p=>p.group===group),c=a.length>1?a.filter(p=>p.name!==prev):a,p=c[Math.floor(Math.random()*c.length)];prev=p.name;start(p)}

function start(p){selected=[];locked=false;const a=patterns[p.price]||[p.price,1000];pay=a[Math.floor(Math.random()*a.length)];change=pay-p.price;payMoney=split(pay);$("questionNumber").textContent=q;$("productName").innerHTML=p.nameHtml;$("priceValue").textContent=p.price;$("displayPrice").textContent=p.price;$("displayPayment").textContent=pay;$("displayChange").textContent=change;$("paymentTotal").textContent=pay;$("productImage").style.display="block";$("productFallback").style.display="none";$("productImage").src=p.image;$("productImage").alt=p.name;$("productImage").onerror=()=>{$("productImage").style.display="none";$("productFallback").style.display="block";$("productFallback").innerHTML=p.nameHtml};showPayment();updateSelected();$("message").innerHTML="";$("successLayer").classList.remove("show");show("register")}

function split(n){const a=[];values.forEach(v=>{while(n>=v){a.push(v);n-=v}});return a}

function moneyPic(v){const d=document.createElement("div");d.className="money-picture"+(v>=1000?" bill":"");d.innerHTML=`<img src="images/money_${v}.png" alt="${v}円"><div class="money-fallback">${v}<ruby>円<rt>えん</rt></ruby></div>`;const i=d.querySelector("img"),f=d.querySelector(".money-fallback");i.onerror=()=>{i.style.display="none";f.style.display="block"};return d}

function showPayment(){$("paymentMoneyList").innerHTML="";payMoney.forEach(v=>$("paymentMoneyList").appendChild(moneyPic(v)))}

function total(){return selected.reduce((a,b)=>a+b,0)}

function updateSelected(){$("selectedTotal").textContent=total();values.forEach(v=>$("count"+v).textContent=selected.filter(x=>x===v).length);$("selectedMoneyBox").innerHTML="";selected.forEach(v=>$("selectedMoneyBox").appendChild(moneyPic(v)));$("selectedMoneyBox").scrollLeft=$("selectedMoneyBox").scrollWidth}

$("resetButton").onclick=()=>{if(locked||!selected.length)return;selected.pop();updateSelected();$("message").innerHTML=msg.reselect};

$("noChangeButton").onclick=()=>{if(locked)return;locked=true;if(change===0){$("successText").innerHTML="ちょうどいただきました。<br>ありがとうございました！";answer(true)}else{$("message").innerHTML=msg.has;answer(false)}};

$("checkoutButton").onclick=()=>{if(locked)return;locked=true;const t=total();if(change>0&&t===change){$("successText").innerHTML="おつりをただしく<ruby>渡<rt>わた</rt></ruby>せました。<br>ありがとうございました！";answer(true)}else{$("message").innerHTML=change===0?msg.none:t<change?msg.little:msg.much;answer(false)}};

function answer(ok){showJudge(ok);if(ok){correct++;setTimeout(()=>$("successLayer").classList.add("show"),800)}else setTimeout(()=>{locked=false;selected=[];updateSelected()},950)}

function showJudge(ok){$("judgeMark").className=ok?"correct-mark":"wrong-mark";$("judgeLayer").classList.add("show");setTimeout(()=>$("judgeLayer").classList.remove("show"),700)}

$("nextButton").onclick=()=>{$("successLayer").classList.remove("show");if(correct>=10){$("clearLayer").classList.add("show");return}q++;randomProduct()};

$("restartButton").onclick=()=>{q=1;correct=0;prev="";$("clearLayer").classList.remove("show");randomProduct()};

document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});

addEventListener("orientationchange",()=>setTimeout(()=>scrollTo(0,0),250));

show("group");

</script>
