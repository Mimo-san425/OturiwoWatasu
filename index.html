<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>販売学習 ぷちレジ</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;

  font-family:
    "UD デジタル 教科書体 N-R",
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;

  background: #eaf1f5;
  color: #222;
}

button {
  font-family: inherit;
}

.hidden {
  display: none !important;
}

.screen {
  width: 100%;
  height: 100%;
}

/* =========================
   班選択画面
========================= */

#groupScreen {
  display: flex;
  flex-direction: column;
}

.group-header {
  height: 11vh;
  min-height: 70px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #1686c7;
  color: #fff;

  border-bottom: 5px solid #fff;

  font-size: clamp(27px, 3.2vw, 44px);
  font-weight: 900;
}

.group-main {
  flex: 1;
  min-height: 0;

  padding: 22px;

  display: flex;
  flex-direction: column;
}

.group-guide {
  margin-bottom: 20px;

  text-align: center;

  font-size: clamp(27px, 3vw, 42px);
  font-weight: 900;
}

.group-grid {
  flex: 1;
  min-height: 0;

  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
}

.group-button {
  min-height: 180px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  border: 5px solid #fff;
  border-radius: 24px;

  box-shadow: 0 8px 0 rgba(0, 0, 0, 0.18);

  font-size: clamp(21px, 2.3vw, 33px);
  font-weight: 900;
}

.group-button:active {
  transform: translateY(5px);
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
}

.group-icon {
  margin-bottom: 10px;
  font-size: clamp(56px, 6.7vw, 92px);
}

.handicraft {
  background: #ffe0ea;
  color: #9b3e62;
}

.gardening {
  background: #e1f5d6;
  color: #3d742a;
}

.pottery {
  background: #f2e4d6;
  color: #795137;
}

.recycle {
  background: #dff5ec;
  color: #287258;
}

.craft {
  background: #ddecff;
  color: #315f8d;
}

/* =========================
   レジ画面
========================= */

#registerScreen {
  display: flex;
  flex-direction: column;
}

.register-header {
  height: 9vh;
  min-height: 56px;

  position: relative;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 5px 14px;

  background: #1686c7;
  color: #fff;

  border-bottom: 5px solid #fff;
}

.register-title {
  font-size: clamp(23px, 2.7vw, 37px);
  font-weight: 900;
}

.group-badge,
.progress-badge {
  position: absolute;
  top: 50%;

  transform: translateY(-50%);

  min-width: 120px;
  padding: 5px 12px;

  border: 3px solid #fff;
  border-radius: 12px;

  background: #fff;
  color: #176d9f;

  text-align: center;

  font-size: clamp(14px, 1.4vw, 20px);
  font-weight: 900;
}

.group-badge {
  left: 13px;
}

.progress-badge {
  right: 13px;
}

.register-main {
  flex: 1;
  min-height: 0;

  display: grid;
  grid-template-columns: 55% 45%;
  gap: 10px;

  padding: 10px;
}

.panel {
  min-height: 0;

  padding: 11px;

  border-radius: 20px;

  background: #fff;

  box-shadow: 0 5px 14px rgba(0, 0, 0, 0.14);
}

.panel-heading {
  min-height: 42px;
  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  margin-bottom: 8px;

  border-radius: 13px;

  font-size: clamp(19px, 2vw, 28px);
  font-weight: 900;
}

/* =========================
   左側
========================= */

.sale-panel {
  display: flex;
  flex-direction: column;
}

.sale-panel .panel-heading {
  background: #fff0c4;
  color: #895500;
}

.sale-content {
  flex: 1;
  min-height: 0;

  display: grid;
  grid-template-columns: 46% 54%;
  gap: 9px;
}

/* 商品 */

.product-card {
  min-height: 0;

  padding: 8px;

  border: 4px solid #efc260;
  border-radius: 17px;

  background: #fffaf0;

  display: flex;
  flex-direction: column;
}

.product-image-box {
  flex: 1;
  min-height: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  border-radius: 13px;
  background: #fff;
}

.product-image-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.product-fallback {
  display: none;

  padding: 10px;

  text-align: center;
  line-height: 1.3;

  font-size: clamp(19px, 1.9vw, 27px);
  font-weight: 900;
}

.product-name {
  min-height: 48px;

  margin-top: 6px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
  line-height: 1.2;

  overflow-wrap: anywhere;

  font-size: clamp(16px, 1.6vw, 23px);
  font-weight: 900;
}

.price-display {
  flex-shrink: 0;

  margin-top: 6px;
  padding: 6px;

  border-radius: 13px;

  background: #ffec9e;

  text-align: center;
}

.price-label {
  font-size: clamp(14px, 1.4vw, 19px);
  font-weight: 900;
  color: #865300;
}

.price-value {
  font-size: clamp(32px, 3.7vw, 50px);
  font-weight: 900;
}

/* お客さんと支払い */

.customer-area {
  min-height: 0;

  display: grid;
  grid-template-rows: 48% 52%;
  gap: 8px;
}

.customer-top {
  min-height: 0;

  display: grid;
  grid-template-columns: 45% 55%;
  gap: 7px;

  padding: 7px;

  border: 4px solid #eea78e;
  border-radius: 17px;

  background: #fff1ec;
}

.customer-picture {
  min-height: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  border-radius: 13px;
  background: #fff;
}

.customer-picture img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.customer-fallback {
  display: none;
  font-size: clamp(68px, 8vw, 115px);
}

.customer-speech {
  display: flex;
  align-items: center;
  justify-content: center;

  padding: 8px;

  border: 3px solid #555;
  border-radius: 18px;

  background: #fff;

  text-align: center;
  line-height: 1.35;

  font-size: clamp(16px, 1.65vw, 23px);
  font-weight: 900;
}

/* 支払ったお金 */

.payment-area {
  min-height: 0;

  padding: 7px;

  border: 4px solid #79bce4;
  border-radius: 17px;

  background: #edf8ff;

  display: flex;
  flex-direction: column;
}

.payment-label {
  flex-shrink: 0;

  text-align: center;

  color: #286e99;

  font-size: clamp(15px, 1.5vw, 21px);
  font-weight: 900;
}

.customer-money-list {
  flex: 1;
  min-height: 0;

  padding: 5px;

  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;

  gap: 5px;
}

.payment-total {
  flex-shrink: 0;

  padding: 6px;

  border-radius: 12px;

  background: #d6eeff;

  text-align: center;

  font-size: clamp(19px, 2vw, 28px);
  font-weight: 900;
}

/* =========================
   右側 会計
========================= */

.checkout-panel {
  min-height: 0;

  display: flex;
  flex-direction: column;
}

.checkout-panel .panel-heading {
  background: #ddf4e5;
  color: #277048;
}

/* 会計表示 */

.display-screen {
  flex-shrink: 0;

  padding: 8px 11px;

  border: 5px solid #39515f;
  border-radius: 12px;

  background: #eaf7ef;

  box-shadow: inset 0 0 0 3px #b8d6c2;
}

.display-row {
  min-height: 48px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom: 2px solid #9cb7a5;

  font-size: clamp(17px, 1.7vw, 24px);
  font-weight: 900;
}

.display-row:last-child {
  border-bottom: none;
}

.display-row strong {
  font-size: clamp(24px, 2.7vw, 38px);
}

.change-question {
  color: #c5521e;
}

/* 選んだ金額 */

.selected-area {
  flex-shrink: 0;

  margin-top: 7px;
  padding: 6px;

  border-radius: 13px;

  background: #e9f5ff;

  text-align: center;
}

.selected-label {
  font-size: clamp(14px, 1.4vw, 20px);
  font-weight: 900;
  color: #316b91;
}

.selected-value {
  font-size: clamp(27px, 3vw, 42px);
  font-weight: 900;
}

.selected-money-box {
  min-height: 50px;

  margin-top: 5px;
  padding: 3px;

  border: 3px solid #9bc5df;
  border-radius: 11px;

  background: #fff;

  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;

  gap: 2px;

  overflow: hidden;
}

.money-guide {
  flex-shrink: 0;

  margin: 6px 0 3px;

  text-align: center;

  font-size: clamp(14px, 1.4vw, 20px);
  font-weight: 900;
}

/* お金ボタン */

.money-buttons {
  flex: 1;
  min-height: 0;

  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;

  align-content: center;
}

.money-button {
  min-height: 84px;

  position: relative;

  padding: 4px;

  border: 3px solid #84a4b6;
  border-radius: 13px;

  background: #f5f9fb;

  box-shadow: 0 4px 0 #627f8e;
}

.money-button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #627f8e;
}

.money-button img {
  width: 100%;
  height: 43px;
  object-fit: contain;
}

.money-button-label {
  font-size: clamp(14px, 1.4vw, 19px);
  font-weight: 900;
}

.money-count {
  position: absolute;
  top: -7px;
  right: -6px;

  min-width: 28px;
  height: 28px;
  padding: 1px 5px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 3px solid #fff;
  border-radius: 15px;

  background: #ef5b70;
  color: #fff;

  font-size: 14px;
  font-weight: 900;
}

/* 操作ボタン */

.action-row {
  flex-shrink: 0;

  margin-top: 7px;

  display: grid;
  grid-template-columns: 0.9fr 1fr 1.3fr;
  gap: 6px;
}

.action-button {
  min-height: 49px;

  border: none;
  border-radius: 13px;

  font-size: clamp(16px, 1.6vw, 22px);
  font-weight: 900;

  box-shadow: 0 4px 0 rgba(0, 0, 0, 0.22);
}

.action-button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.22);
}

.reset-button {
  background: #e4e4e4;
  color: #444;
}

.no-change-button {
  background: #68bd80;
  color: #fff;
}

.checkout-button {
  background: #ef6c4f;
  color: #fff;
}

.message {
  flex-shrink: 0;

  min-height: 39px;

  margin-top: 6px;
  padding: 4px 7px;

  border-radius: 11px;

  background: #fff3c3;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  font-size: clamp(14px, 1.4vw, 20px);
  font-weight: 900;
}

/* =========================
   お金画像
========================= */

.money-picture {
  width: 58px;
  height: 43px;

  display: flex;
  align-items: center;
  justify-content: center;
}

.money-picture.bill {
  width: 98px;
  height: 48px;
}

.money-picture img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;

  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.2));
}

.money-fallback {
  display: none;

  padding: 5px 7px;

  border: 3px solid #8e6b00;
  border-radius: 50%;

  background: #e9c242;

  font-size: 13px;
  font-weight: 900;
}

.money-picture.bill .money-fallback {
  border-radius: 7px;
  border-color: #3b7f58;
  background: #bae0c7;
}

.selected-money-box .money-picture {
  width: 40px;
  height: 30px;
}

.selected-money-box .money-picture.bill {
  width: 68px;
  height: 33px;
}

.selected-money-box .money-fallback {
  padding: 2px 4px;
  font-size: 10px;
}

/* =========================
   判定
========================= */

.judge-layer {
  position: fixed;
  inset: 0;
  z-index: 50;

  display: none;
  align-items: center;
  justify-content: center;

  pointer-events: none;
}

.judge-layer.show {
  display: flex;
}

.correct-mark {
  width: min(30vw, 260px);
  height: min(30vw, 260px);

  border: 25px solid #ef3340;
  border-radius: 50%;

  filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.25));
}

.wrong-mark {
  width: min(30vw, 260px);
  height: min(30vw, 260px);

  position: relative;

  filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.25));
}

.wrong-mark::before,
.wrong-mark::after {
  content: "";

  position: absolute;
  top: 0;
  left: 43%;

  width: 14%;
  height: 100%;

  border-radius: 18px;

  background: #1973ef;
}

.wrong-mark::before {
  transform: rotate(45deg);
}

.wrong-mark::after {
  transform: rotate(-45deg);
}

/* =========================
   正解画面
========================= */

.success-layer,
.clear-layer {
  position: fixed;
  inset: 0;

  display: none;
  align-items: center;
  justify-content: center;
}

.success-layer {
  z-index: 60;
  background: rgba(0, 0, 0, 0.42);
}

.success-layer.show,
.clear-layer.show {
  display: flex;
}

.success-card {
  width: min(72vw, 600px);

  padding: 28px;

  border: 7px solid #1686c7;
  border-radius: 27px;

  background: #fff;

  text-align: center;

  box-shadow: 0 14px 30px rgba(0, 0, 0, 0.28);
}

.success-title {
  color: #e74d68;

  font-size: clamp(40px, 5vw, 65px);
  font-weight: 900;
}

.success-text {
  margin: 12px 0 21px;

  font-size: clamp(22px, 2.6vw, 35px);
  font-weight: 900;
}

.next-button {
  min-width: 240px;
  min-height: 57px;

  border: none;
  border-radius: 16px;

  background: #1686c7;
  color: #fff;

  font-size: clamp(20px, 2.1vw, 29px);
  font-weight: 900;

  box-shadow: 0 5px 0 #0d5f91;
}

/* =========================
   10問クリア
========================= */

.clear-layer {
  z-index: 80;

  background:
    radial-gradient(circle, #fff38c 0 8%, transparent 9%),
    radial-gradient(circle, #ffaec2 0 7%, transparent 8%),
    #cceeff;

  background-size: 100px 100px, 140px 140px;
}

.clear-card {
  width: min(84vw, 760px);

  padding: 34px;

  border: 8px solid #1686c7;
  border-radius: 32px;

  background: #fff;

  text-align: center;

  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.28);
}

.clear-icons {
  font-size: clamp(52px, 7vw, 92px);
}

.clear-title {
  color: #ef4966;

  font-size: clamp(48px, 6.8vw, 88px);
  font-weight: 900;
}

.clear-text {
  margin: 16px 0 25px;

  font-size: clamp(24px, 3vw, 40px);
  font-weight: 900;
  line-height: 1.5;
}

.restart-button {
  min-width: 260px;
  min-height: 60px;

  border: none;
  border-radius: 17px;

  background: #ffd75b;
  color: #333;

  font-size: clamp(21px, 2.2vw, 30px);
  font-weight: 900;

  box-shadow: 0 5px 0 #c39b22;
}

/* =========================
   高さが小さいiPad
========================= */

@media screen and (max-height: 650px) {
  .register-header {
    height: 8vh;
    min-height: 48px;
  }

  .register-main {
    padding: 6px;
    gap: 6px;
  }

  .panel {
    padding: 7px;
  }

  .panel-heading {
    min-height: 33px;
    margin-bottom: 5px;
  }

  .product-card,
  .customer-top,
  .payment-area {
    padding: 5px;
  }

  .product-name {
    min-height: 36px;
    margin-top: 4px;
  }

  .price-display {
    margin-top: 4px;
    padding: 4px;
  }

  .price-value {
    font-size: clamp(27px, 3vw, 40px);
  }

  .display-screen {
    padding: 5px 8px;
  }

  .display-row {
    min-height: 37px;
  }

  .selected-area {
    margin-top: 5px;
    padding: 4px;
  }

  .selected-money-box {
    min-height: 38px;
    margin-top: 4px;
  }

  .money-guide {
    margin: 4px 0 2px;
  }

  .money-button {
    min-height: 64px;
    padding: 2px;
  }

  .money-button img {
    height: 30px;
  }

  .action-row {
    margin-top: 5px;
    gap: 5px;
  }

  .action-button {
    min-height: 39px;
  }

  .message {
    min-height: 31px;
    margin-top: 5px;
  }
}
</style>
</head>

<body>

<!-- 班選択画面 -->

<section id="groupScreen" class="screen">

  <header class="group-header">
    販売学習　ぷちレジ
  </header>

  <main class="group-main">

    <div class="group-guide">
      自分の班を選んでください
    </div>

    <div class="group-grid">

      <button class="group-button handicraft" data-group="手工芸">
        <span class="group-icon">🧵</span>
        手工芸
      </button>

      <button class="group-button gardening" data-group="園芸">
        <span class="group-icon">🌱</span>
        園芸
      </button>

      <button class="group-button pottery" data-group="陶工">
        <span class="group-icon">🏺</span>
        陶工
      </button>

      <button class="group-button recycle" data-group="リサイクル">
        <span class="group-icon">♻️</span>
        リサイクル
      </button>

      <button class="group-button craft" data-group="工芸">
        <span class="group-icon">🧺</span>
        工芸
      </button>

    </div>

  </main>

</section>

<!-- レジ画面 -->

<section id="registerScreen" class="screen hidden">

  <header class="register-header">

    <div class="group-badge" id="groupBadge"></div>

    <div class="register-title">
      販売学習　ぷちレジ
    </div>

    <div class="progress-badge">
      <span id="questionNumber">1</span> / 10もん
    </div>

  </header>

  <main class="register-main">

    <!-- 左側 -->

    <section class="panel sale-panel">

      <div class="panel-heading">
        商品とお客さん
      </div>

      <div class="sale-content">

        <!-- 商品 -->

        <div class="product-card">

          <div class="product-image-box">

            <img id="productImage" src="" alt="">

            <div
              class="product-fallback"
              id="productFallback"
            ></div>

          </div>

          <div
            class="product-name"
            id="productName"
          ></div>

          <div class="price-display">

            <div class="price-label">
              商品代
            </div>

            <div class="price-value">
              <span id="priceValue">0</span>円
            </div>

          </div>

        </div>

        <!-- お客さんとお金 -->

        <div class="customer-area">

          <div class="customer-top">

            <div class="customer-picture">

              <img
                id="customerImage"
                src="images/customer.png"
                alt="お客さん"
              >

              <div
                class="customer-fallback"
                id="customerFallback"
              >
                🧑
              </div>

            </div>

            <div class="customer-speech">
              これで<br>
              おねがいします
            </div>

          </div>

          <div class="payment-area">

            <div class="payment-label">
              お客さんが出したお金
            </div>

            <div
              class="customer-money-list"
              id="customerMoneyList"
            ></div>

            <div class="payment-total">
              合計
              <span id="paymentTotal">0</span>円
            </div>

          </div>

        </div>

      </div>

    </section>

    <!-- 右側 -->

    <section class="panel checkout-panel">

      <div class="panel-heading">
        会計
      </div>

      <div class="display-screen">

        <div class="display-row">
          <span>商品代</span>

          <strong>
            <span id="displayPrice">0</span>円
          </strong>
        </div>

        <div class="display-row">
          <span>お預かり</span>

          <strong>
            <span id="displayPayment">0</span>円
          </strong>
        </div>

        <div class="display-row change-question">
          <span>おつり</span>
          <strong>？？？</strong>
        </div>

      </div>

      <div class="selected-area">

        <div class="selected-label">

<script>

];

const moneyValues = [
  1000,
  500,
  100,
  50
];

const moneyImages = {
  1000: "images/money_1000.png",
  500: "images/money_500.png",
  100: "images/money_100.png",
  50: "images/money_50.png"
};

let selectedGroup = "";
let previousProductName = "";

let questionNumber = 1;
let correctCount = 0;

let paymentAmount = 0;
let paymentMoney = [];
let correctChange = 0;

let selectedMoney = [];
let locked = false;

const groupScreen =
  document.getElementById("groupScreen");

const registerScreen =
  document.getElementById("registerScreen");

const groupBadge =
  document.getElementById("groupBadge");

const questionNumberElement =
  document.getElementById("questionNumber");

const productImage =
  document.getElementById("productImage");

const productFallback =
  document.getElementById("productFallback");

const productName =
  document.getElementById("productName");

const priceValue =
  document.getElementById("priceValue");

const customerImage =
  document.getElementById("customerImage");

const customerFallback =
  document.getElementById("customerFallback");

const customerMoneyList =
  document.getElementById("customerMoneyList");

const paymentTotalElement =
  document.getElementById("paymentTotal");

const displayPrice =
  document.getElementById("displayPrice");

const displayPayment =
  document.getElementById("displayPayment");

const selectedTotalElement =
  document.getElementById("selectedTotal");

const selectedMoneyBox =
  document.getElementById("selectedMoneyBox");

const message =
  document.getElementById("message");

const judgeLayer =
  document.getElementById("judgeLayer");

const judgeMark =
  document.getElementById("judgeMark");

const successLayer =
  document.getElementById("successLayer");

const successText =
  document.getElementById("successText");

const clearLayer =
  document.getElementById("clearLayer");

customerImage.addEventListener("error", function() {
  customerImage.style.display = "none";
  customerFallback.style.display = "block";
});

function showScreen(name) {
  groupScreen.classList.add("hidden");
  registerScreen.classList.add("hidden");

  if (name === "group") {
    groupScreen.classList.remove("hidden");
  }

  if (name === "register") {
    registerScreen.classList.remove("hidden");
  }
}

document
  .querySelectorAll(".group-button")
  .forEach(function(button) {
    button.addEventListener("click", function() {
      selectedGroup = button.dataset.group;
      previousProductName = "";
      questionNumber = 1;
      correctCount = 0;

      groupBadge.textContent =
        selectedGroup + "班";

      startRandomProduct();
    });
  });

function startRandomProduct() {
  const groupProducts =
    products.filter(function(product) {
      return product.group === selectedGroup;
    });

  if (groupProducts.length === 0) {
    alert("この班には商品がありません。");
    return;
  }

  let candidates = groupProducts;

  if (groupProducts.length > 1) {
    candidates =
      groupProducts.filter(function(product) {
        return product.name !== previousProductName;
      });
  }

  const product =
    candidates[
      Math.floor(Math.random() * candidates.length)
    ];

  previousProductName =
    product.name;

  startCheckout(product);
}

function startCheckout(product) {
  selectedMoney = [];
  locked = false;

  makePayment(product.price);

  questionNumberElement.textContent =
    questionNumber;

  productName.textContent =
    product.name;

  priceValue.textContent =
    product.price;

  displayPrice.textContent =
    product.price;

  displayPayment.textContent =
    paymentAmount;

  productImage.style.display =
    "block";

  productFallback.style.display =
    "none";

  productImage.src =
    product.image;

  productImage.alt =
    product.name;

  productImage.onerror =
    function() {
      productImage.style.display =
        "none";

      productFallback.style.display =
        "block";

      productFallback.textContent =
        product.name;
    };

  paymentTotalElement.textContent =
    paymentAmount;

  showCustomerMoney();
  updateSelectedMoney();

  message.textContent =
    "商品代とお預かりを確認してください";

  successLayer.classList.remove("show");

  showScreen("register");
}

/* ちょうど払いを含む */

function makePayment(price) {
  let possiblePayments = [];

  if (price === 50) {
    possiblePayments = [50, 100, 500];

  } else if (price === 100) {
    possiblePayments = [100, 500, 1000];

  } else if (price === 200) {
    possiblePayments = [200, 500, 1000];

  } else if (price === 300) {
    possiblePayments = [300, 500, 1000];

  } else if (price === 400) {
    possiblePayments = [400, 500, 1000];

  } else if (price === 600) {
    possiblePayments = [600, 1000];

  } else if (price === 1000) {
    possiblePayments = [1000, 2000];

  } else {
    possiblePayments = [price, 1000];
  }

  paymentAmount =
    possiblePayments[
      Math.floor(
        Math.random() * possiblePayments.length
      )
    ];

  correctChange =
    paymentAmount - price;

  paymentMoney =
    splitMoney(paymentAmount);
}

function splitMoney(total) {
  const result = [];
  let remaining = total;

  moneyValues.forEach(function(value) {
    while (remaining >= value) {
      result.push(value);
      remaining -= value;
    }
  });

  return result;
}

function makeMoneyPicture(value) {
  const wrapper =
    document.createElement("div");

  wrapper.className =
    "money-picture";

  if (value >= 1000) {
    wrapper.classList.add("bill");
  }

  const image =
    document.createElement("img");

  image.src =
    moneyImages[value];

  image.alt =
    value + "円";

  const fallback =
    document.createElement("div");

  fallback.className =
    "money-fallback";

  fallback.textContent =
    value + "円";

  image.addEventListener("error", function() {
    image.style.display = "none";
    fallback.style.display = "block";
  });

  wrapper.appendChild(image);
  wrapper.appendChild(fallback);

  return wrapper;
}

function showCustomerMoney() {
  customerMoneyList.innerHTML = "";

  paymentMoney.forEach(function(value) {
    customerMoneyList.appendChild(
      makeMoneyPicture(value)
    );
  });
}

function getSelectedTotal() {
  return selectedMoney.reduce(
    function(total, value) {
      return total + value;
    },
    0
  );
}

function updateSelectedMoney() {
  selectedTotalElement.textContent =
    getSelectedTotal();

  moneyValues.forEach(function(value) {
    const count =
      selectedMoney.filter(
        function(selectedValue) {
          return selectedValue === value;
        }
      ).length;

    document.getElementById(
      "count" + value
    ).textContent = count;
  });

  selectedMoneyBox.innerHTML = "";

  selectedMoney.forEach(function(value) {
    selectedMoneyBox.appendChild(
      makeMoneyPicture(value)
    );
  });
}

document
  .querySelectorAll(".money-button")
  .forEach(function(button) {
    button.addEventListener("click", function() {
      if (locked) {
        return;
      }

      selectedMoney.push(
        Number(button.dataset.value)
      );

      updateSelectedMoney();

      message.textContent =
        "渡す金額を確認してください";
    });
  });

document
  .getElementById("resetButton")
  .addEventListener("click", function() {
    if (locked) {
      return;
    }

    selectedMoney = [];
    updateSelectedMoney();

    message.textContent =
      "おつりを選びなおしてください";
  });

document
  .getElementById("noChangeButton")
  .addEventListener("click", function() {
    if (locked) {
      return;
    }

    locked = true;

    if (correctChange === 0) {
      successText.textContent =
        "ちょうどいただきました。ありがとうございました！";

      correctAnswer();

    } else {
      message.textContent =
        "おつりがあります";

      wrongAnswer();
    }
  });

document
  .getElementById("checkoutButton")
  .addEventListener("click", function() {
    if (locked) {
      return;
    }

    locked = true;

    const selectedTotal =
      getSelectedTotal();

    if (
      correctChange > 0 &&
      selectedTotal === correctChange
    ) {
      successText.textContent =
        "おつりを正しく渡せました。ありがとうございました！";

      correctAnswer();

    } else {
      if (correctChange === 0) {
        message.textContent =
          "おつりはありません";

      } else if (selectedTotal < correctChange) {
        message.textContent =
          "おつりが足りません";

      } else {
        message.textContent =
          "おつりが多すぎます";
      }

      wrongAnswer();
    }
  });

function correctAnswer() {
  correctCount++;

  showJudge(true);

  setTimeout(function() {
    successLayer.classList.add("show");
  }, 800);
}

function wrongAnswer() {
  showJudge(false);

  setTimeout(function() {
    locked = false;
    selectedMoney = [];
    updateSelectedMoney();
  }, 950);
}

function showJudge(isCorrect) {
  judgeMark.className =
    isCorrect
      ? "correct-mark"
      : "wrong-mark";

  judgeLayer.classList.add("show");

  setTimeout(function() {
    judgeLayer.classList.remove("show");
  }, 700);
}

document
  .getElementById("nextButton")
  .addEventListener("click", function() {
    successLayer.classList.remove("show");

    if (correctCount >= 10) {
      clearLayer.classList.add("show");
      return;
    }

    questionNumber++;
    startRandomProduct();
  });

document
  .getElementById("restartButton")
  .addEventListener("click", function() {
    questionNumber = 1;
    correctCount = 0;
    previousProductName = "";

    clearLayer.classList.remove("show");

    startRandomProduct();
  });

document.addEventListener(
  "dblclick",
  function(event) {
    event.preventDefault();
  },
  {
    passive: false
  }
);

showScreen("group");
</script>
